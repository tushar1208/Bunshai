<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Server Error - BunShai TECHNOHUB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0b1120 0%, #1e1b4b 55%, #4c0519 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 580px;
      width: 100%;
      background: #ffffff;
      color: #0b1120;
      border-radius: 20px;
      padding: 44px 34px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }
    .brand {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8b0a2e;
      margin-bottom: 10px;
    }
    .code {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      color: #8b0a2e;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.65rem; margin-bottom: 12px; color: #0b1120; }
    p { font-size: 1rem; line-height: 1.65; color: #475569; margin-bottom: 28px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid transparent;
      font-size: 0.95rem;
    }
    .btn-primary { background: #8b0a2e; color: #ffffff; }
    .btn-secondary { background: #f1f5f9; color: #0b1120; border-color: #cbd5e1; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">BunShai TECHNOHUB</div>
    <div class="code">500</div>
    <h1>Something Went Wrong on Our Side</h1>
    <p>An unexpected server error occurred while processing your request. Our technical team has been notified. Please try reloading the page or visit one of the links below.</p>
    <div class="actions">
      <button type="button" class="btn btn-primary" onclick="window.location.reload()">Try Again</button>
      <a href="/" class="btn btn-secondary">Back to Home</a>
      <a href="/courses/" class="btn btn-secondary">Courses</a>
      <a href="/support/" class="btn btn-secondary">Support</a>
    </div>
  </main>
</body>
</html>
